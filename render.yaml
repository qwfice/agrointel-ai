services:
  - type: web
    name: agrointel-ai-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      # sync: false means Render will prompt for these in its dashboard
      # rather than storing the values in this file - nobody's real key
      # or password lives in this repo.
      - key: GEMINI_API_KEY
        sync: false
      - key: EARTHDATA_USERNAME
        sync: false
      - key: EARTHDATA_PASSWORD
        sync: false
